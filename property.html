<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Property Details</title>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50">

<!-- BACK -->
<div class="p-4 max-w-6xl mx-auto">
  <a href="index.html" class="text-indigo-600 font-semibold">← Back to listings</a>
</div>

<div id="content" class="max-w-6xl mx-auto bg-white rounded-2xl shadow p-5 md:p-8"></div>

<script>

const data = {
  1: {
    title: "Modern 2BHK Apartment",
    price: "₹12,000 / month",
    location: "Vijayawada, MG Road",
    type: "Rent",
    size: "2BHK | 1100 sq.ft",
    desc: "A beautifully designed modern apartment with excellent ventilation, natural light, and premium interior finish. Located in a prime area with easy access to schools, markets, and transport. Ideal for families or working professionals looking for comfort and convenience.",
    features: ["24/7 Water Supply", "Parking", "Security", "Lift", "Balcony", "Power Backup"],
    images: [
      "https://images.unsplash.com/photo-1560185007-c5ca9d2c014d",
      "https://images.unsplash.com/photo-1501183638710-841dd1904471",
      "https://images.unsplash.com/photo-1600585154340-be6161a56a0c"
    ],
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%202BHK%20Apartment"
  },

  2: {
    title: "Luxury Independent Villa",
    price: "₹65 Lakhs",
    location: "Guntur Highway",
    type: "Sale",
    size: "3BHK | 2400 sq.ft",
    desc: "A premium luxury villa designed with modern architecture, private garden space, spacious rooms, and high-end fittings. Located in a peaceful residential zone with excellent connectivity. Perfect for premium lifestyle living.",
    features: ["Private Garden", "Parking", "Security", "Modular Kitchen", "Terrace", "Water Tank"],
    images: [
      "https://images.unsplash.com/photo-1570129477492-45c003edd2be",
      "https://images.unsplash.com/photo-1600585154526-990dced4db0d",
      "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c"
    ],
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%20Villa"
  }
};

const id = new URLSearchParams(window.location.search).get("id");
const p = data[id];

// IMAGE GALLERY
let gallery = `
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
  <img src="${p.images[0]}" class="md:col-span-2 w-full h-80 object-cover rounded-xl"/>
  <div class="grid gap-3">
    <img src="${p.images[1]}" class="h-38 object-cover rounded-xl"/>
    <img src="${p.images[2]}" class="h-38 object-cover rounded-xl"/>
  </div>
</div>
`;

document.getElementById("content").innerHTML = `

${gallery}

<!-- TITLE -->
<h1 class="text-2xl md:text-3xl font-bold">${p.title}</h1>

<!-- PRICE BADGE -->
<div class="mt-3 flex flex-wrap gap-3 items-center">
  <span class="text-green-600 text-xl font-bold">${p.price}</span>
  <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-sm">${p.type}</span>
  <span class="bg-gray-100 px-3 py-1 rounded-full text-sm">${p.size}</span>
</div>

<!-- LOCATION -->
<p class="text-gray-500 mt-2">📍 ${p.location}</p>

<!-- DESCRIPTION -->
<div class="mt-6">
  <h2 class="text-lg font-semibold mb-2">Description</h2>
  <p class="text-gray-700 leading-relaxed">${p.desc}</p>
</div>

<!-- FEATURES -->
<div class="mt-6">
  <h2 class="text-lg font-semibold mb-2">Amenities</h2>
  <div class="flex flex-wrap gap-2">
    ${p.features.map(f => `
      <span class="bg-gray-100 px-3 py-1 rounded-full text-sm">${f}</span>
    `).join("")}
  </div>
</div>

<!-- CTA -->
<a href="${p.wa}" target="_blank"
   class="block text-center bg-green-500 text-white font-bold py-3 rounded-xl mt-8 hover:bg-green-600">
   💬 Contact Owner on WhatsApp
</a>

`;
</script>

</body>
</html>
