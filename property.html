<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Property Details</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50">

<!-- BACK -->
<div class="p-4">
  <a href="index.html" class="text-indigo-600 font-semibold">← Back to listings</a>
</div>

<!-- CONTENT -->
<div id="content" class="max-w-4xl mx-auto bg-white rounded-2xl shadow p-6"></div>

<script>
const data = {
  1: {
    title: "Modern 2BHK Apartment",
    price: "₹12,000 / month",
    desc: "Beautiful and spacious apartment with ventilation, parking, 24/7 water supply and security.",
    location: "Vijayawada",
    img: "https://images.unsplash.com/photo-1560185007-c5ca9d2c014d",
    features: ["Parking", "Water Supply", "Security", "Balcony"],
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%202BHK"
  },

  2: {
    title: "Luxury Villa",
    price: "₹65 Lakhs",
    desc: "Premium villa with garden, parking space, modern architecture and peaceful environment.",
    location: "Guntur",
    img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be",
    features: ["Garden", "Parking", "Security", "Modern Design"],
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%20Villa"
  }
};

const id = new URLSearchParams(window.location.search).get("id");
const p = data[id];

document.getElementById("content").innerHTML = `
  <img src="${p.img}" class="rounded-xl mb-5 w-full h-72 object-cover"/>

  <h1 class="text-2xl font-bold">${p.title}</h1>

  <p class="text-green-600 text-xl font-semibold mt-2">${p.price}</p>

  <p class="text-gray-500 mt-1">📍 ${p.location}</p>

  <p class="mt-4 text-gray-700">${p.desc}</p>

  <div class="flex flex-wrap gap-2 mt-4">
    ${p.features.map(f => `<span class='bg-gray-100 px-3 py-1 rounded-full text-sm'>${f}</span>`).join("")}
  </div>

  <a href="${p.wa}" target="_blank"
     class="block text-center bg-green-500 text-white font-bold py-3 rounded-xl mt-6 hover:bg-green-600">
     💬 Contact on WhatsApp
  </a>
`;
</script>

</body>
</html>
