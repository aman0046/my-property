<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Property Listings</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #1e3c72, #2a5298);
  color: white;
  text-align: center;
  padding: 20px;
}

/* GRID */
.container {
  max-width: 1100px;
  margin: auto;
  padding: 15px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 15px;
}

/* CARD */
.card {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  cursor: pointer;
  transition: 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

.card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
}

.card-body {
  padding: 12px;
}

.price {
  color: green;
  font-weight: bold;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}

.modal-content {
  background: white;
  width: 90%;
  max-width: 600px;
  border-radius: 15px;
  overflow: hidden;
  animation: pop 0.2s ease;
}

@keyframes pop {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.slider img {
  width: 100%;
  height: 250px;
  object-fit: cover;
}

.details {
  padding: 15px;
}

.features {
  font-size: 14px;
  color: #444;
  margin: 10px 0;
}

.btn {
  display: block;
  text-align: center;
  background: #25D366;
  color: white;
  padding: 10px;
  text-decoration: none;
  border-radius: 10px;
  font-weight: bold;
  margin-top: 10px;
}

.close {
  float: right;
  font-size: 22px;
  cursor: pointer;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h2>🏠 Dream Properties</h2>
  <p>Find your perfect home</p>
</header>

<div class="container">
  <div class="grid">

    <div class="card" onclick="openModal(0)">
      <img src="https://images.unsplash.com/photo-1560185007-c5ca9d2c014d"/>
      <div class="card-body">
        <h3>2BHK Apartment</h3>
        <div class="price">₹12,000 / month</div>
      </div>
    </div>

    <div class="card" onclick="openModal(1)">
      <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be"/>
      <div class="card-body">
        <h3>Luxury Villa</h3>
        <div class="price">₹65 Lakhs</div>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">

    <span class="close" onclick="closeModal()">×</span>

    <div class="slider">
      <img id="img1" />
    </div>

    <div class="details">
      <h2 id="title"></h2>
      <h3 id="price"></h3>
      <p id="desc"></p>
      <p class="features" id="features"></p>

      <a id="wa" class="btn" target="_blank">💬 Contact on WhatsApp</a>
    </div>

  </div>
</div>

<script>
const properties = [
  {
    title: "2BHK Modern Apartment",
    price: "₹12,000 / month",
    desc: "Beautiful apartment with ventilation and city view.",
    features: "✔ Water ✔ Parking ✔ Security",
    img: "https://images.unsplash.com/photo-1560185007-c5ca9d2c014d",
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%202BHK"
  },
  {
    title: "Luxury Villa",
    price: "₹65 Lakhs",
    desc: "Premium villa with garden and parking space.",
    features: "✔ Garden ✔ Parking ✔ Security",
    img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be",
    wa: "https://wa.me/91XXXXXXXXXX?text=I%20am%20interested%20in%20Villa"
  }
];

function openModal(i){
  document.getElementById("modal").style.display = "flex";

  document.getElementById("img1").src = properties[i].img;
  document.getElementById("title").innerText = properties[i].title;
  document.getElementById("price").innerText = properties[i].price;
  document.getElementById("desc").innerText = properties[i].desc;
  document.getElementById("features").innerText = properties[i].features;
  document.getElementById("wa").href = properties[i].wa;
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
