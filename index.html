<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Premium Properties</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50">

<!-- HEADER -->
<header class="bg-gradient-to-r from-indigo-700 to-blue-600 text-white p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold">🏠 Elite Property Listings</h1>
    <p class="text-sm opacity-80">Find verified homes & apartments instantly</p>
  </div>
</header>

<!-- FILTER BAR -->
<div class="max-w-6xl mx-auto p-4">
  <div class="bg-white shadow rounded-xl p-3 flex gap-2 overflow-x-auto">
    <button class="px-4 py-2 bg-indigo-600 text-white rounded-full text-sm">All</button>
    <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">Rent</button>
    <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">Buy</button>
    <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">1BHK</button>
    <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">2BHK</button>
    <button class="px-4 py-2 bg-gray-100 rounded-full text-sm">Villa</button>
  </div>
</div>

<!-- GRID -->
<div class="max-w-6xl mx-auto p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

  <!-- CARD 1 -->
  <a href="property.html?id=1" class="bg-white rounded-2xl overflow-hidden shadow hover:shadow-xl transition">
    <img src="https://images.unsplash.com/photo-1560185007-c5ca9d2c014d"
         class="h-48 w-full object-cover"/>
    <div class="p-4">
      <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full">For Rent</span>
      <h2 class="font-bold mt-2">Modern 2BHK Apartment</h2>
      <p class="text-green-600 font-semibold">₹12,000 / month</p>
      <p class="text-sm text-gray-500">📍 Vijayawada</p>
    </div>
  </a>

  <!-- CARD 2 -->
  <a href="property.html?id=2" class="bg-white rounded-2xl overflow-hidden shadow hover:shadow-xl transition">
    <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be"
         class="h-48 w-full object-cover"/>
    <div class="p-4">
      <span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded-full">For Sale</span>
      <h2 class="font-bold mt-2">Luxury Villa</h2>
      <p class="text-green-600 font-semibold">₹65 Lakhs</p>
      <p class="text-sm text-gray-500">📍 Guntur</p>
    </div>
  </a>

</div>

<!-- FOOTER -->
<footer class="text-center text-sm text-gray-500 p-6">
  © 2026 Elite Properties | Built for Brokers
</footer>

</body>
</html>
