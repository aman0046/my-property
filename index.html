<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties</title>

  <style>
    body { font-family: Arial; margin:0; background:#f4f6fb; }
    header { background:#1e3c72; color:white; padding:20px; text-align:center; }

    .container { padding:15px; max-width:1000px; margin:auto; }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:15px;
    }

    .card {
      background:white;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      text-decoration:none;
      color:black;
      display:block;
    }

    .card img {
      width:100%;
      height:160px;
      object-fit:cover;
    }

    .card div {
      padding:10px;
    }

    .price { color:green; font-weight:bold; }
  </style>
</head>

<body>

<header>
  <h2>🏠 Dream Properties</h2>
</header>

<div class="container">

  <div class="grid">

    <!-- PROPERTY 1 -->
    <a class="card" href="property.html?id=1">
      <img src="https://images.unsplash.com/photo-1560185007-c5ca9d2c014d">
      <div>
        <h3>2BHK Apartment</h3>
        <div class="price">₹12,000 / month</div>
      </div>
    </a>

    <!-- PROPERTY 2 -->
    <a class="card" href="property.html?id=2">
      <img src="https://images.unsplash.com/photo-1570129477492-45c003edd2be">
      <div>
        <h3>Luxury Villa</h3>
        <div class="price">₹65 Lakhs</div>
      </div>
    </a>

  </div>
</div>

</body>
</html>
